name: Validate layouts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test GODAN composition
        run: python -m unittest discover -s tests -v
      - name: Validate layouts and bundle
        run: python scripts/check_layouts.py
      - name: Check shared romanization tables
        run: python scripts/update_godan_romanization.py --check
      - name: Regenerate and verify diagrams
        run: |
          python scripts/render_previews.py
          git diff --exit-code
